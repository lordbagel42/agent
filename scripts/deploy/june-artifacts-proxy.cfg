# HAProxy 3.0+. Publishes only the shared-artifact listener, never a slot,
# /health, /operator or /console. June keeps every access/PIN check.
global
    maxconn 128
    nbthread 1

defaults
    mode http
    timeout connect 2s
    # Viewer SSE writes every two seconds; this only bounds silent peers.
    timeout client 75s
    timeout server 75s
    timeout http-request 10s
    timeout queue 1s
    retries 0
    retry-on none
    no log

frontend june_artifacts
    bind 192.168.0.215:3087
    http-request deny deny_status 403 unless { req.fhdr(host) -m str june-share.raygen.dev }
    http-request deny deny_status 404 unless { path -m beg /artifacts/ }
    http-request deny deny_status 405 unless METH_GET || METH_HEAD || METH_POST
    http-after-response set-header Cache-Control "no-store, private"
    default_backend june_artifacts_active

backend june_artifacts_active
    # Only the active slot binds the artifact port, after activation.
    server active 127.0.0.1:3086
