# HAProxy 3.0+. Only this MCP endpoint is published; no admin/health routes.
# The application retains all authentication and authorization checks.
global
    maxconn 64
    nbthread 1

defaults
    mode http
    timeout connect 2s
    timeout client 60s
    timeout server 60s
    timeout http-request 10s
    timeout queue 1s
    retries 0
    retry-on none
    no log

frontend june_mcp
    bind 192.168.0.215:3085
    http-request deny deny_status 403 unless { req.fhdr(host) -m str june-mcp.raygen.dev }
    http-request deny deny_status 404 unless { url -m str /mcp }
    http-request deny deny_status 405 unless METH_POST
    http-after-response set-header Cache-Control no-store
    default_backend june_mcp_slots

backend june_mcp_slots
    # Only one process can own June's runtime lock. Standby/draining return 503.
    http-request deny deny_status 503 unless { nbsrv(june_mcp_slots) eq 1 }
    option httpchk GET /health
    http-check expect status 200
    default-server check inter 1s fall 1 rise 1
    server blue 127.0.0.1:3081
    server green 127.0.0.1:3082
