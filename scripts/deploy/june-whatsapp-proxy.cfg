# HAProxy 3.0+. Only Meta's callback is public; signatures stay verified in June.
global
    maxconn 64
    nbthread 1

defaults
    mode http
    timeout connect 2s
    timeout client 60s
    timeout server 60s
    timeout http-request 10s
    timeout queue 1s
    retries 0
    retry-on none
    no log

frontend june_whatsapp
    bind 192.168.0.215:3086
    http-request deny deny_status 403 unless { req.fhdr(host) -m str june-whatsapp.raygen.dev }
    # Unlike MCP, GET challenge verification requires query parameters.
    http-request deny deny_status 404 unless { path -m str /webhooks/whatsapp }
    http-request deny deny_status 405 unless METH_GET or METH_POST
    http-after-response set-header Cache-Control no-store
    default_backend june_whatsapp_slots

backend june_whatsapp_slots
    # Never acknowledge while no slot (or unexpectedly both) is ready.
    # Meta retries non-200 delivery; the proxy must not retry POSTs itself.
    http-request deny deny_status 503 unless { nbsrv(june_whatsapp_slots) eq 1 }
    option httpchk GET /health
    http-check expect status 200
    default-server check inter 1s fall 1 rise 1
    server blue 127.0.0.1:3081
    server green 127.0.0.1:3082
